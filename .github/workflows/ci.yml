name: Kinex Browser CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package-mac:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KINEX_DISABLE_AUTO_UPDATER: '1'
      KINEX_TEST_MODE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify Apple Silicon runner and native toolchain
        run: |
          test "$(uname -m)" = arm64
          xcode-select -p
          rustc --version
          cargo --version

      - name: Install locked dependencies and build native addon
        run: npm ci

      - name: Download pinned Electron runtime
        run: npx --no-install install-electron

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck and compiler lint
        run: npm run typecheck && npm run lint

      - name: Run pure unit and boundary regression tests
        run: npm run test:pure

      - name: Run native Shields unit tests
        run: npm run test:native

      - name: Build production bundles
        run: npm run build

      - name: Verify cold Shields startup lifecycle and responsiveness
        run: node tests/perf/run-shields-initialization.mjs

      - name: Run real Electron integration and security regressions
        run: node tests/integration/run-integration.mjs && node tests/integration/run-security.mjs

      - name: Run browser E2E workflows
        run: node tests/e2e/run-e2e.mjs

      - name: Verify keyboard, focus, profile, and Shields workflows
        run: |
          node tests/e2e/run-keyboard-only.mjs --out=artifacts/ci/keyboard
          node tests/integration/run-experience.mjs --out=artifacts/ci/experience.json
          node tests/integration/run-shields.mjs

      - name: Package ad-hoc signed arm64 validation bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac

      - name: Launch packaged application with disposable data
        run: node tests/integration/run-packaged.mjs

      - name: Verify DMG and launch its bundled application
        run: node tests/integration/run-dmg.mjs

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kinex-mac-validation
          path: artifacts/ci
          if-no-files-found: warn
          retention-days: 14
