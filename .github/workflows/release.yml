name: Release Kinex macOS

on:
  workflow_run:
    workflows: ['Kinex Browser CI']
    branches: [main]
    types: [completed]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kinex-macos-release
  cancel-in-progress: false

jobs:
  release-mac:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 40
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Choose signed or manual preview release
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::notice::Signing secret not configured: $name."
              missing=1
            fi
          done
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$missing" -eq 0 ]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == 0.* ]]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Publishing a free unsigned preview for manual download. Signed auto-installation is unavailable.'
          else
            echo '::error::Production releases require Developer ID signing and notarization.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Download pinned Electron runtime
        run: npx --no-install install-electron

      - name: Resolve release channel
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          TAG_REFS="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [ -n "$TAG_REFS" ]; then
            TAG_SHA="$(echo "$TAG_REFS" | tail -1 | cut -f1)"
            if [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
              echo '::error::Version already belongs to another commit. Bump the patch version and push again.'
              exit 1
            fi
          fi
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -ge 1 ]; then
            echo "Kinex $VERSION is a production release; signing and notarization are required."
          else
            echo "Kinex $VERSION is a pre-production preview; unsigned manual downloads are supported."
          fi

      - name: Run Verification Suite
        run: npm audit --audit-level=moderate && npm run lint && npm run test:all

      - name: Package signed and notarized macOS release assets
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx --no-install electron-builder --mac --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true
          codesign --verify --deep --strict release/mac-arm64/Kinex.app
          xcrun stapler validate release/mac-arm64/Kinex.app
          spctl --assess --type execute --verbose release/mac-arm64/Kinex.app
          node tests/integration/run-packaged.mjs

      - name: Package unsigned macOS preview for manual download
        if: steps.signing.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --no-install electron-builder --mac --arm64 --publish never
          node tests/integration/run-packaged.mjs

      - name: Verify DMG and launch its bundled application
        run: node tests/integration/run-dmg.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          # A slower, older run must not replace the current main branch's update feed.
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$MAIN_SHA" != "$(git rev-parse HEAD)" ]; then
            echo '::notice::A newer main commit exists; its successful CI will publish the update.'
            exit 0
          fi
          ASSETS=(release/Kinex-*.dmg release/Kinex-*-mac.zip)
          if [ "$SIGNED" = true ]; then
            ASSETS+=(release/latest-mac.yml release/Kinex-*-mac.zip.blockmap)
            NOTES='Signed and notarized macOS release.'
          else
            NOTES='Unsigned 0.x preview for manual download and installation. This build is not notarized; macOS Gatekeeper may block it. Automatic update installation is not supported for this build. No auto-update manifest is published.'
          fi
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            if [ "$IS_DRAFT" = false ]; then
              echo '::notice::This version is already published; preserving immutable update artifacts.'
              exit 0
            fi
            if [ "$SIGNED" != true ]; then
              DRAFT_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              while IFS= read -r asset; do
                case "$asset" in
                  latest-mac.yml|*.blockmap) gh release delete-asset "$TAG" "$asset" --yes ;;
                esac
              done <<< "$DRAFT_ASSETS"
            fi
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --draft --target "$(git rev-parse HEAD)" \
              --title "Kinex Browser $TAG" \
              --notes "$NOTES" --generate-notes
          fi
          gh release edit "$TAG" --draft=false --prerelease=false --latest
