name: Release Kinex macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-15
    timeout-minutes: 40
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned Electron runtime
        run: npx --no-install install-electron

      - name: Resolve release channel
        id: channel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -ge 1 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Kinex $VERSION is a production release; signing and notarization are required."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Kinex $VERSION is a pre-1.0 pre-release; packaging unsigned."
          fi

      - name: Run Verification Suite
        run: npm audit --audit-level=moderate && npm run lint && npm run test:all

      - name: Require signing and notarization configuration
        if: steps.channel.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Package signed and notarized macOS release assets
        if: steps.channel.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx --no-install electron-builder --mac --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true
          codesign --verify --deep --strict release/mac-arm64/Kinex.app
          xcrun stapler validate release/mac-arm64/Kinex.app
          spctl --assess --type execute --verbose release/mac-arm64/Kinex.app
          node tests/integration/run-packaged.mjs

      - name: Package unsigned pre-release assets
        if: steps.channel.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --no-install electron-builder --mac --arm64 --publish never
          node tests/integration/run-packaged.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/latest-mac.yml release/Kinex-*-mac.zip release/Kinex-*-mac.zip.blockmap --clobber
          else
            gh release create "$TAG" release/latest-mac.yml release/Kinex-*-mac.zip release/Kinex-*-mac.zip.blockmap \
              --title "Kinex Browser $TAG" \
              --generate-notes $PRERELEASE_FLAG
          fi
